name: Patch Gemini structured output

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Gemini client
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text()
          old = '''async function gemini(prompt) {
  const model = process.env.GEMINI_MODEL || 'gemini-3.5-flash-lite';
  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': process.env.GEMINI_API_KEY },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { responseMimeType: 'application/json' }
    })
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error?.message || `Gemini request failed (${response.status})`);
  const text = data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
  if (!text) throw new Error('Gemini returned no usable response.');
  try { return JSON.parse(text); } catch { throw new Error('Gemini returned invalid JSON.'); }
}'''
          new = '''async function gemini(prompt, schema) {
  const model = process.env.GEMINI_MODEL || 'gemini-3.6-flash';
  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': process.env.GEMINI_API_KEY },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: {
        responseMimeType: 'application/json',
        responseSchema: schema
      }
    })
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error?.message || `Gemini request failed (${response.status})`);
  const text = data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
  if (!text) throw new Error('Gemini returned no usable response.');
  try { return JSON.parse(text); } catch {
    const retry = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': process.env.GEMINI_API_KEY },
      body: JSON.stringify({
        contents: [{ parts: [{ text: `${prompt}\\n\\nIMPORTANT: return ONLY a valid JSON object matching the provided schema.` }] }],
        generationConfig: { responseMimeType: 'application/json', responseSchema: schema }
      })
    });
    const retryData = await retry.json();
    if (!retry.ok) throw new Error(retryData.error?.message || `Gemini retry failed (${retry.status})`);
    const retryText = retryData.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
    try { return JSON.parse(retryText); } catch { throw new Error('Gemini returned invalid structured output after retry.'); }
  }
}'''
          if old not in s:
              raise SystemExit('Expected Gemini function was not found; refusing to modify server.js')
          s = s.replace(old, new, 1)
          s = s.replace("const repair = await gemini(`You are Agent 1 repairing your own code change.", "const repair = await gemini(`You are Agent 1 repairing your own code change.", 1)
          repair_end = "\\n\\nRELEVANT SNAPSHOT:\\n${snapshot}`);"
          s = s.replace(repair_end, repair_end[:-2] + ", {type:'object',properties:{summary:{type:'string'},edits:{type:'array',items:{type:'object',properties:{path:{type:'string'},content:{type:'string'}},required:['path','content'],additionalProperties:false}},risks:{type:'array',items:{type:'string'}},confidence:{type:'number',minimum:0,maximum:1}},required:['summary','edits','risks','confidence'],additionalProperties:false});", 1)
          plan_end = "\\n\\nRELEVANT FILE SNAPSHOT:\\n${snapshotData.snapshot}`);"
          s = s.replace(plan_end, plan_end[:-2] + ", {type:'object',properties:{summary:{type:'string'},risks:{type:'array',items:{type:'string'}},relevantFiles:{type:'array',items:{type:'string'}},edits:{type:'array',items:{type:'object',properties:{path:{type:'string'},content:{type:'string'}},required:['path','content'],additionalProperties:false}},tests:{type:'array',items:{type:'string'}},confidence:{type:'number',minimum:0,maximum:1}},required:['summary','risks','relevantFiles','edits','tests','confidence'],additionalProperties:false});", 1)
          p.write_text(s)
          PY
      - name: Validate server
        run: node --check server.js
      - name: Commit patch
        run: |
          git config user.name 'Agent 1'
          git config user.email 'agent-1@users.noreply.github.com'
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use Gemini structured outputs for agent planning'
          git push
