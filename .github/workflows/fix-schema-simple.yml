name: Fix Gemini schema compatibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unsupported schema keywords
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['server.js', 'structured-output-schema.json']:
              p = Path(name)
              if p.exists():
                  s = p.read_text()
                  s = s.replace(', additionalProperties: false', '')
                  s = s.replace(',\"additionalProperties\":false', '')
                  p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check server.js
          python3 -m json.tool structured-output-schema.json >/dev/null
      - name: Commit and clean up
        run: |
          git config user.name 'Agent 1'
          git config user.email 'agent-1@users.noreply.github.com'
          git add server.js structured-output-schema.json
          git rm .github/workflows/fix-schema-simple.yml
          git commit -m 'fix: remove unsupported Gemini schema keywords'
          git push
